; UniHelp — Custom PHP Configuration
; Overrides for Docker container (replaces XAMPP's php.ini settings)

; File uploads (resume: 5MB, images: 2MB — allow headroom)
upload_max_filesize = 20M
post_max_size = 20M

; Script limits
max_execution_time = 120
memory_limit = 256M

; Session
session.gc_maxlifetime = 3600
